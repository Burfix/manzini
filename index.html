<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V&A Waterfront - Compliance Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .nav-item { transition: all 0.2s; }
        .nav-item:hover { background-color: #f3f4f6; }
        .nav-item.active { background-color: #e5e7eb; border-right: 3px solid #1e3a5f; }
        .calendar-day { min-height: 120px; }
        .calendar-day:hover { background-color: #f9fafb; }
        .audit-card { transition: transform 0.2s, box-shadow 0.2s; }
        .audit-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .role-badge { background-color: #fef3c7; color: #92400e; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .priority-high { border-left: 4px solid #dc2626; }
        .priority-medium { border-left: 4px solid #6b7280; }
        .priority-low { border-left: 4px solid #1e3a5f; }
        .status-urgent { background-color: #fee2e2; color: #dc2626; }
        .status-normal { background-color: #f3f4f6; color: #374151; }
        .status-completed { background-color: #d1fae5; color: #065f46; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#1e3a5f] rounded-lg flex items-center justify-center text-white">
                <i class="fas fa-anchor text-lg"></i>
            </div>
            <h1 class="text-xl font-bold text-[#1e3a5f]">V&A Waterfront</h1>
            <span id="currentRoleBadge" class="role-badge px-3 py-1 rounded-full text-sm font-medium ml-2">Compliance Officer</span>
        </div>
        <div class="flex items-center gap-4">
            <button class="relative p-2 text-gray-600 hover:text-gray-800">
                <i class="fas fa-bell text-xl"></i>
                <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
            </button>
            <button onclick="toggleRoleMenu()" class="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">
                <i class="fas fa-exchange-alt"></i>
                <span>Switch Role</span>
            </button>
        </div>
    </header>

    <!-- Role Switcher Dropdown -->
    <div id="roleMenu" class="hidden absolute top-16 right-6 bg-white border border-gray-200 rounded-lg shadow-lg z-50 w-48">
        <button onclick="switchRole('compliance')" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-2 border-b border-gray-100">
            <i class="fas fa-clipboard-check text-[#1e3a5f]"></i>
            <span>Compliance Officer</span>
        </button>
        <button onclick="switchRole('operations')" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-2 border-b border-gray-100">
            <i class="fas fa-hard-hat text-orange-600"></i>
            <span>Operations Manager</span>
        </button>
        <button onclick="switchRole('leadership')" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-2">
            <i class="fas fa-chart-line text-purple-600"></i>
            <span>Mall Leadership</span>
        </button>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
            <nav id="sidebarNav" class="flex-1 py-4">
                <!-- Dynamic sidebar content -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main id="mainContent" class="flex-1 overflow-y-auto p-6 bg-gray-50">
            <!-- Dynamic content -->
        </main>
    </div>

    <script>
        // State
        let currentRole = 'compliance';
        let currentView = 'work';
        let selectedWeekStart = new Date();
        
        // Sample Data
        const audits = [
            { id: 1, tenant: 'Woolworths', location: 'Victoria Wharf', time: '10:00 AM', status: 'pending', priority: 'low', type: 'Routine' },
            { id: 2, tenant: 'H&M', location: 'Clock Tower', time: '11:30 AM', status: 'pending', priority: 'medium', type: 'Routine' },
            { id: 3, tenant: 'Ocean Basket', location: 'Portswood', time: '02:00 PM', status: 'urgent', priority: 'high', type: 'Complaint' },
            { id: 4, tenant: 'Tiger\'s Milk', location: 'Water Shed', saved: '2h ago', progress: 60, status: 'draft', type: 'Follow-up' }
        ];

        const scheduleData = {
            'Mon': [{ time: '10:00 AM', task: 'Woolworths Audit', type: 'audit' }],
            'Tue': [{ time: '11:30 AM', task: 'H&M Inspection', type: 'audit' }],
            'Wed': [{ time: '02:00 PM', task: 'Ocean Basket Urgent', type: 'urgent' }],
            'Thu': [],
            'Fri': [{ time: '09:00 AM', task: 'Team Meeting', type: 'meeting' }],
            'Sat': [],
            'Sun': []
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            render();
        });

        function toggleRoleMenu() {
            const menu = document.getElementById('roleMenu');
            menu.classList.toggle('hidden');
        }

        function switchRole(role) {
            currentRole = role;
            currentView = role === 'compliance' ? 'work' : role === 'operations' ? 'priorities' : 'risk';
            document.getElementById('roleMenu').classList.add('hidden');
            render();
        }

        function render() {
            updateHeader();
            renderSidebar();
            renderContent();
        }

        function updateHeader() {
            const badge = document.getElementById('currentRoleBadge');
            const roles = {
                'compliance': { text: 'Compliance Officer', color: 'bg-amber-100 text-amber-800' },
                'operations': { text: 'Operations Manager', color: 'bg-orange-100 text-orange-800' },
                'leadership': { text: 'Mall Leadership', color: 'bg-purple-100 text-purple-800' }
            };
            badge.textContent = roles[currentRole].text;
            badge.className = `px-3 py-1 rounded-full text-sm font-medium ml-2 ${roles[currentRole].color}`;
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = '';

            const menus = {
                'compliance': [
                    { id: 'work', icon: 'fa-clipboard-list', label: 'My Work' },
                    { id: 'calendar', icon: 'fa-calendar-alt', label: 'Weekly Schedule' },
                    { id: 'tenants', icon: 'fa-building', label: 'Tenants' },
                    { id: 'audits', icon: 'fa-check-square', label: 'Audits' }
                ],
                'operations': [
                    { id: 'priorities', icon: 'fa-exclamation-circle', label: 'Priorities' },
                    { id: 'tenants', icon: 'fa-building', label: 'Tenants' },
                    { id: 'audits', icon: 'fa-clipboard-check', label: 'Audits' },
                    { id: 'maintenance', icon: 'fa-tools', label: 'Maintenance' },
                    { id: 'scheduling', icon: 'fa-calendar', label: 'Staff Scheduling' }
                ],
                'leadership': [
                    { id: 'risk', icon: 'fa-chart-pie', label: 'Risk Overview' },
                    { id: 'precincts', icon: 'fa-map-marker-alt', label: 'All Precincts' },
                    { id: 'analytics', icon: 'fa-chart-line', label: 'Analytics' },
                    { id: 'reports', icon: 'fa-file-alt', label: 'Reports' }
                ]
            };

            menus[currentRole].forEach(item => {
                const btn = document.createElement('button');
                btn.className = `nav-item w-full flex items-center gap-3 px-6 py-3 text-gray-700 ${currentView === item.id ? 'active' : ''}`;
                btn.onclick = () => { currentView = item.id; render(); };
                btn.innerHTML = `
                    <i class="fas ${item.icon} w-5"></i>
                    <span class="font-medium">${item.label}</span>
                `;
                nav.appendChild(btn);
            });
        }

        function renderContent() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '';

            if (currentRole === 'compliance') {
                if (currentView === 'work') renderComplianceWork(main);
                else if (currentView === 'calendar') renderCalendar(main);
                else if (currentView === 'tenants') renderTenants(main);
                else if (currentView === 'audits') renderAudits(main);
            } else if (currentRole === 'operations') {
                if (currentView === 'priorities') renderOpsPriorities(main);
                else if (currentView === 'tenants') renderOpsTenants(main);
                else if (currentView === 'audits') renderOpsAudits(main);
                else if (currentView === 'maintenance') renderMaintenance(main);
                else if (currentView === 'scheduling') renderStaffScheduling(main);
            } else if (currentRole === 'leadership') {
                if (currentView === 'risk') renderRiskOverview(main);
                else if (currentView === 'precincts') renderPrecincts(main);
                else if (currentView === 'analytics') renderAnalytics(main);
                else if (currentView === 'reports') renderReports(main);
            }
        }

        // COMPLIANCE OFFICER VIEWS
        function renderComplianceWork(container) {
            container.innerHTML = `
                <div class="fade-in max-w-4xl">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">My Work</h2>
                        <span class="text-gray-500">Officer: John Doe</span>
                    </div>

                    <!-- Today's Audits -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
                        <div class="flex items-center gap-2 mb-4">
                            <i class="far fa-calendar text-[#1e3a5f]"></i>
                            <h3 class="font-semibold text-lg">Today's Audits (3)</h3>
                        </div>
                        <div class="space-y-3">
                            ${audits.filter(a => a.status !== 'draft').map(audit => `
                                <div class="audit-card flex items-center justify-between p-4 rounded-lg border border-gray-200 priority-${audit.priority} ${audit.status === 'urgent' ? 'bg-red-50' : 'bg-gray-50'}">
                                    <div>
                                        <h4 class="font-semibold text-gray-800 ${audit.status === 'urgent' ? 'text-red-700' : ''}">${audit.tenant}</h4>
                                        <p class="text-sm text-gray-500 mt-1">${audit.location} • ${audit.time} ${audit.status === 'urgent' ? '• URGENT' : ''}</p>
                                    </div>
                                    <button onclick="startAudit(${audit.id})" class="px-6 py-2 rounded-lg font-medium ${audit.status === 'urgent' ? 'bg-red-600 text-white hover:bg-red-700' : 'bg-[#1e3a5f] text-white hover:bg-blue-900'} transition-colors">
                                        Start
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Draft Audits -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <div class="flex items-center gap-2 mb-4">
                            <i class="fas fa-edit text-yellow-600"></i>
                            <h3 class="font-semibold text-lg">Draft Audits (1)</h3>
                        </div>
                        <div class="audit-card flex items-center justify-between p-4 rounded-lg border border-gray-200 bg-yellow-50">
                            <div>
                                <h4 class="font-semibold text-gray-800">Tiger's Milk</h4>
                                <p class="text-sm text-gray-500 mt-1">Water Shed • Saved 2h ago • 60% complete</p>
                            </div>
                            <button class="px-6 py-2 rounded-lg font-medium bg-yellow-600 text-white hover:bg-yellow-700 transition-colors">
                                Resume
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCalendar(container) {
            const weekDays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const fullDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            
            container.innerHTML = `
                <div class="fade-in h-full flex flex-col">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">Weekly Schedule</h2>
                            <p class="text-gray-500 mt-1">Plan and manage your audit schedule</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="changeWeek(-1)" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <span class="px-4 py-2 font-medium text-gray-700 bg-white border border-gray-300 rounded-lg">
                                ${formatWeekRange()}
                            </span>
                            <button onclick="changeWeek(1)" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                            <button onclick="openScheduleModal()" class="ml-2 px-4 py-2 bg-[#1e3a5f] text-white rounded-lg hover:bg-blue-900 flex items-center gap-2">
                                <i class="fas fa-plus"></i> Schedule Audit
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-7 gap-4 flex-1">
                        ${weekDays.map((day, idx) => `
                            <div class="bg-white rounded-xl border border-gray-200 flex flex-col overflow-hidden">
                                <div class="bg-gray-50 px-4 py-3 border-b border-gray-200">
                                    <p class="text-xs font-semibold text-gray-500 uppercase">${day}</p>
                                    <p class="text-lg font-bold text-gray-800">${getDateForDay(idx)}</p>
                                </div>
                                <div class="calendar-day p-3 space-y-2 overflow-y-auto">
                                    ${(scheduleData[day] || []).map(item => `
                                        <div class="p-2 rounded-lg text-sm ${getScheduleItemClass(item.type)} cursor-pointer hover:opacity-80 transition-opacity" onclick="editSchedule('${day}', '${item.task}')">
                                            <p class="font-medium">${item.task}</p>
                                            <p class="text-xs opacity-75">${item.time}</p>
                                        </div>
                                    `).join('')}
                                    <button onclick="quickAdd('${day}')" class="w-full py-2 border-2 border-dashed border-gray-300 rounded-lg text-gray-400 hover:border-[#1e3a5f] hover:text-[#1e3a5f] transition-colors text-sm">
                                        <i class="fas fa-plus"></i> Add
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Quick Stats -->
                    <div class="grid grid-cols-4 gap-4 mt-6">
                        <div class="bg-white p-4 rounded-xl border border-gray-200">
                            <p class="text-sm text-gray-500">Scheduled Audits</p>
                            <p class="text-2xl font-bold text-[#1e3a5f]">12</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-gray-200">
                            <p class="text-sm text-gray-500">Completed This Week</p>
                            <p class="text-2xl font-bold text-green-600">8</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-gray-200">
                            <p class="text-sm text-gray-500">Pending Reviews</p>
                            <p class="text-2xl font-bold text-orange-600">3</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-gray-200">
                            <p class="text-sm text-gray-500">Urgent Items</p>
                            <p class="text-2xl font-bold text-red-600">1</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function getScheduleItemClass(type) {
            const classes = {
                'audit': 'bg-blue-100 text-blue-800',
                'urgent': 'bg-red-100 text-red-800',
                'meeting': 'bg-purple-100 text-purple-800',
                'inspection': 'bg-green-100 text-green-800'
            };
            return classes[type] || 'bg-gray-100 text-gray-800';
        }

        function formatWeekRange() {
            const start = new Date(selectedWeekStart);
            const end = new Date(start);
            end.setDate(end.getDate() + 6);
            return `${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
        }

        function getDateForDay(index) {
            const date = new Date(selectedWeekStart);
            date.setDate(date.getDate() + index);
            return date.getDate();
        }

        function changeWeek(direction) {
            selectedWeekStart.setDate(selectedWeekStart.getDate() + (direction * 7));
            render();
        }

        function openScheduleModal() {
            alert('Schedule Audit Modal - Would open a form to schedule new audits');
        }

        function quickAdd(day) {
            const task = prompt(`Add task for ${day}:`);
            if (task) {
                if (!scheduleData[day]) scheduleData[day] = [];
                scheduleData[day].push({ time: '09:00 AM', task: task, type: 'audit' });
                render();
            }
        }

        function editSchedule(day, task) {
            if (confirm(`Remove "${task}" from ${day}?`)) {
                scheduleData[day] = scheduleData[day].filter(i => i.task !== task);
                render();
            }
        }

        function renderTenants(container) {
            container.innerHTML = `
                <div class="fade-in">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Tenant Directory</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${['Woolworths', 'H&M', 'Ocean Basket', 'Tiger\'s Milk', 'Cotton On', 'Ster-Kinekor'].map(tenant => `
                            <div class="bg-white p-6 rounded-xl border border-gray-200 hover:shadow-md transition-shadow cursor-pointer">
                                <div class="flex items-start justify-between mb-3">
                                    <h3 class="font-semibold text-lg text-gray-800">${tenant}</h3>
                                    <span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full">Active</span>
                                </div>
                                <p class="text-gray-500 text-sm mb-4">Victoria Wharf • Last audited: 2 weeks ago</p>
                                <div class="flex gap-2">
                                    <button class="flex-1 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50">View Profile</button>
                                    <button class="flex-1 py-2 bg-[#1e3a5f] text-white rounded-lg text-sm hover:bg-blue-900">Schedule Audit</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAudits(container) {
            container.innerHTML = `
                <div class="fade-in">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">All Audits</h2>
                    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tenant</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Location</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                ${audits.map(audit => `
                                    <tr class="hover:bg-gray-50">
                                        <td class="px-6 py-4 font-medium text-gray-900">${audit.tenant}</td>
                                        <td class="px-6 py-4 text-gray-500">${audit.location}</td>
                                        <td class="px-6 py-4 text-gray-500">Today, ${audit.time || 'N/A'}</td>
                                        <td class="px-6 py-4">
                                            <span class="px-2 py-1 text-xs rounded-full ${audit.status === 'urgent' ? 'bg-red-100 text-red-700' : audit.status === 'draft' ? 'bg-yellow-100 text-yellow-700' : 'bg-blue-100 text-blue-700'}">
                                                ${audit.status.charAt(0).toUpperCase() + audit.status.slice(1)}
                                            </span>
                                        </td>
                                        <td class="px-6 py-4">
                                            <button class="text-[#1e3a5f] hover:text-blue-900 font-medium text-sm">View Details</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // OPERATIONS MANAGER VIEWS
        function renderOpsPriorities(container) {
            container.innerHTML = `
                <div class="fade-in">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Operations Priorities</h2>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
                        <div class="lg:col-span-2 space-y-4">
                            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-bold text-red-900">Critical: HVAC System Failure</h3>
                                        <p class="text-red-700 mt-1">Victoria Wharf - Zone C requires immediate attention</p>
                                        <p class="text-sm text-red-600 mt-2">Reported 30 minutes ago • Assigned to Maintenance Team B</p>
                                    </div>
                                    <span class="px-3 py-1 bg-red-200 text-red-800 rounded-full text-sm font-medium">Critical</span>
                                </div>
                            </div>
                            
                            <div class="bg-orange-50 border-l-4 border-orange-500 p-4 rounded-r-lg">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-bold text-orange-900">High: Security Patrol Gap</h3>
                                        <p class="text-orange-700 mt-1">Clock Tower area - 02:00 AM shift uncovered</p>
                                        <p class="text-sm text-orange-600 mt-2">Scheduled for immediate reassignment</p>
                                    </div>
                                    <span class="px-3 py-1 bg-orange-200 text-orange-800 rounded-full text-sm font-medium">High</span>
                                </div>
                            </div>

                            <div class="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded-r-lg">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-bold text-yellow-900">Medium: Cleaning Schedule Overlap</h3>
                                        <p class="text-yellow-700 mt-1">Portswood precinct double-booked for tomorrow</p>
                                    </div>
                                    <span class="px-3 py-1 bg-yellow-200 text-yellow-800 rounded-full text-sm font-medium">Medium</span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl border border-gray-200">
                            <h3 class="font-semibold text-gray-800 mb-4">Quick Actions</h3>
                            <div class="space-y-2">
                                <button class="w-full py-2 px-4 bg-[#1e3a5f] text-white rounded-lg hover:bg-blue-900 text-left flex items-center gap-2">
                                    <i class="fas fa-plus"></i> Create Work Order
                                </button>
                                <button class="w-full py-2 px-4 border border-gray-300 rounded-lg hover:bg-gray-50 text-left flex items-center gap-2">
                                    <i class="fas fa-user-plus"></i> Assign Staff
                                </button>
                                <button class="w-full py-2 px-4 border border-gray-300 rounded-lg hover:bg-gray-50 text-left flex items-center gap-2">
                                    <i class="fas fa-phone"></i> Contact Vendor
                                </button>
                                <button class="w-full py-2 px-4 border border-gray-300 rounded-lg hover:bg-gray-50 text-left flex items-center gap-2">
                                    <i class="fas fa-file-alt"></i> Generate Report
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-4 gap-4">
