<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V&A Waterfront - Compliance Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'va-yellow': '#FFCC32',
                        'va-yellow-light': '#FFE066',
                        'va-yellow-dark': '#E6B800',
                        'va-blue': '#236192',
                        'va-blue-light': '#4A9FD4',
                        'va-blue-dark': '#1A4A6E',
                        'va-coral': '#F4A261',
                        'va-teal': '#5E8982',
                        'va-sand': '#EEE6CB',
                        'va-slate': '#9FAFBE'
                    },
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '2.5rem',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Poppins', sans-serif;
            background-color: #F8F9FA;
        }
        .nav-item { 
            transition: all 0.3s ease;
            border-radius: 1rem;
            margin: 0.25rem 0.75rem;
        }
        .nav-item:hover { 
            background-color: #FFF8E1;
            color: #236192;
        }
        .nav-item.active { 
            background-color: #FFCC32;
            color: #1A4A6E;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(255, 204, 50, 0.3);
        }
        .nav-item.active i {
            color: #236192;
        }
        .calendar-day { 
            min-height: 120px;
            border-radius: 1rem;
        }
        .calendar-day:hover { 
            background-color: #FFF8E1;
        }
        .audit-card { 
            transition: all 0.3s ease;
            border-radius: 1.5rem;
        }
        .audit-card:hover { 
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .role-badge { 
            background-color: #FFCC32;
            color: #1A4A6E;
            font-weight: 600;
        }
        .fade-in { 
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .priority-high { border-left: 5px solid #EF4444; }
        .priority-medium { border-left: 5px solid #F59E0B; }
        .priority-low { border-left: 5px solid #236192; }
        .cert-card { 
            transition: all 0.3s ease;
            border-radius: 1.5rem;
        }
        .cert-card:hover { 
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .upload-area { 
            border: 3px dashed #CBD5E1; 
            transition: all 0.3s ease;
            border-radius: 1.5rem;
        }
        .upload-area:hover { 
            border-color: #FFCC32; 
            background-color: #FFF8E1;
        }
        .upload-area.dragover { 
            border-color: #236192; 
            background-color: #EFF6FF;
        }
        .btn-primary {
            background-color: #FFCC32;
            color: #1A4A6E;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 1rem;
        }
        .btn-primary:hover {
            background-color: #E6B800;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(255, 204, 50, 0.4);
        }
        .btn-secondary {
            background-color: #236192;
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 1rem;
        }
        .btn-secondary:hover {
            background-color: #1A4A6E;
            transform: translateY(-2px);
        }
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .gradient-hero {
            background: linear-gradient(135deg, #236192 0%, #4A9FD4 100%);
        }
        .gradient-warm {
            background: linear-gradient(135deg, #FFCC32 0%, #F4A261 100%);
        }
        .soft-shadow {
            box-shadow: 0 10px 40px -10px rgba(35, 97, 146, 0.15);
        }
        .icon-circle {
            width: 3rem;
            height: 3rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status-pill {
            border-radius: 9999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        /* Background image styling */
        .bg-waterfront {
            background-image: url('https://images.unsplash.com/photo-1580060839134-75a5edca2e27?w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .bg-overlay {
            background: linear-gradient(135deg, rgba(248, 249, 250, 0.97) 0%, rgba(248, 249, 250, 0.95) 100%);
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 h-20 flex items-center justify-between px-8 shadow-sm z-20 relative">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-va-yellow rounded-2xl flex items-center justify-center text-va-blue-dark shadow-lg transform -rotate-3">
                <i class="fas fa-anchor text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-va-blue-dark tracking-tight">V&A Waterfront</h1>
                <p class="text-xs text-slate-400 font-medium tracking-wider uppercase">Compliance Portal</p>
            </div>
            <span id="currentRoleBadge" class="role-badge px-4 py-1.5 rounded-full text-sm ml-4 shadow-sm">Compliance Officer</span>
        </div>
        <div class="flex items-center gap-6">
            <button class="relative p-3 text-slate-400 hover:text-va-blue transition-colors rounded-xl hover:bg-slate-50">
                <i class="fas fa-bell text-xl"></i>
                <span id="notificationBadge" class="absolute top-2 right-2 w-2.5 h-2.5 bg-va-coral rounded-full border-2 border-white"></span>
            </button>
            <div class="flex items-center gap-3 pl-6 border-l border-slate-200 cursor-pointer" onclick="toggleRoleMenu()">
                <div class="text-right hidden md:block">
                    <p class="text-sm font-semibold text-slate-700" id="userName">John Doe</p>
                    <p class="text-xs text-slate-400">Switch Role</p>
                </div>
                <div class="w-12 h-12 bg-gradient-to-br from-va-blue to-va-blue-light rounded-2xl flex items-center justify-center text-white shadow-lg">
                    <i class="fas fa-user text-lg"></i>
                </div>
                <i class="fas fa-chevron-down text-slate-400 text-sm"></i>
            </div>
        </div>
    </header>

    <!-- Role Switcher Dropdown -->
    <div id="roleMenu" class="hidden absolute top-24 right-8 bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl z-50 w-72 overflow-hidden border border-slate-100">
        <div class="px-6 py-4 bg-gradient-to-r from-va-yellow to-va-yellow-light">
            <p class="text-sm font-bold text-va-blue-dark uppercase tracking-wider">Select Portal</p>
        </div>
        <div class="p-2">
            <button onclick="switchRole('compliance')" class="w-full text-left px-4 py-4 hover:bg-slate-50 flex items-center gap-4 rounded-2xl transition-all group">
                <div class="w-12 h-12 rounded-xl bg-amber-100 flex items-center justify-center text-amber-600 group-hover:scale-110 transition-transform">
                    <i class="fas fa-clipboard-check text-lg"></i>
                </div>
                <div>
                    <p class="font-semibold text-slate-800">Compliance Officer</p>
                    <p class="text-xs text-slate-400">Field Operations</p>
                </div>
            </button>
            <button onclick="switchRole('operations')" class="w-full text-left px-4 py-4 hover:bg-slate-50 flex items-center gap-4 rounded-2xl transition-all group">
                <div class="w-12 h-12 rounded-xl bg-orange-100 flex items-center justify-center text-orange-600 group-hover:scale-110 transition-transform">
                    <i class="fas fa-hard-hat text-lg"></i>
                </div>
                <div>
                    <p class="font-semibold text-slate-800">Operations Manager</p>
                    <p class="text-xs text-slate-400">Facility Management</p>
                </div>
            </button>
            <button onclick="switchRole('leadership')" class="w-full text-left px-4 py-4 hover:bg-slate-50 flex items-center gap-4 rounded-2xl transition-all group">
                <div class="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center text-purple-600 group-hover:scale-110 transition-transform">
                    <i class="fas fa-chart-line text-lg"></i>
                </div>
                <div>
                    <p class="font-semibold text-slate-800">Mall Leadership</p>
                    <p class="text-xs text-slate-400">Executive View</p>
                </div>
            </button>
            <button onclick="switchRole('store')" class="w-full text-left px-4 py-4 hover:bg-slate-50 flex items-center gap-4 rounded-2xl transition-all group">
                <div class="w-12 h-12 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-600 group-hover:scale-110 transition-transform">
                    <i class="fas fa-store text-lg"></i>
                </div>
                <div>
                    <p class="font-semibold text-slate-800">Store Manager</p>
                    <p class="text-xs text-slate-400">Tenant Portal</p>
                </div>
            </button>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- Sidebar -->
        <aside class="w-72 bg-white/95 backdrop-blur-md border-r border-slate-200 flex flex-col z-10 relative">
            <div class="p-6 border-b border-slate-100" id="storeInfo" style="display: none;">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl shadow-lg">
                        W
                    </div>
                    <div>
                        <p class="font-bold text-slate-800">Woolworths</p>
                        <p class="text-xs text-slate-400">Victoria Wharf</p>
                    </div>
                </div>
            </div>
            <nav id="sidebarNav" class="flex-1 py-6 px-2">
                <!-- Dynamic sidebar content -->
            </nav>
            <div class="p-6 border-t border-slate-100">
                <button class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-2xl transition-all text-sm font-medium">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </button>
                <button class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-red-50 hover:text-red-500 rounded-2xl transition-all text-sm font-medium mt-2">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content with Background Image -->
        <main class="flex-1 overflow-y-auto relative bg-waterfront">
            <!-- Faint overlay -->
            <div class="absolute inset-0 bg-overlay"></div>
            <!-- Content -->
            <div id="mainContent" class="relative z-10 p-8 min-h-full">
                <!-- Dynamic content -->
            </div>
        </main>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white/95 backdrop-blur-md rounded-[2rem] shadow-2xl w-full max-w-lg mx-4 overflow-hidden transform transition-all scale-100">
            <div class="px-8 py-6 bg-gradient-to-r from-va-yellow to-va-yellow-light flex justify-between items-center">
                <h3 class="font-bold text-xl text-va-blue-dark">Upload Certificate</h3>
                <button onclick="closeUploadModal()" class="text-va-blue-dark hover:text-va-blue-dark/70 transition-colors w-10 h-10 rounded-full hover:bg-white/20 flex items-center justify-center">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-8">
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-3">Certificate Type</label>
                    <select id="certType" class="w-full px-4 py-3 border-2 border-slate-200 rounded-2xl focus:ring-4 focus:ring-va-yellow/20 focus:border-va-yellow transition-all outline-none bg-slate-50">
                        <option value="health">Health & Safety Certificate</option>
                        <option value="fire">Fire Safety Compliance</option>
                        <option value="liquor">Liquor License</option>
                        <option value="insurance">Public Liability Insurance</option>
                        <option value="food">Food Safety Certificate</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-3">Expiry Date</label>
                    <input type="date" id="certExpiry" class="w-full px-4 py-3 border-2 border-slate-200 rounded-2xl focus:ring-4 focus:ring-va-yellow/20 focus:border-va-yellow transition-all outline-none bg-slate-50">
                </div>
                <div class="mb-8">
                    <label class="block text-sm font-semibold text-slate-700 mb-3">Upload File</label>
                    <div class="upload-area p-8 text-center cursor-pointer" onclick="document.getElementById('fileInput').click()" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                        <input type="file" id="fileInput" class="hidden" accept=".pdf,.jpg,.jpeg,.png" onchange="handleFileSelect(event)">
                        <div class="w-20 h-20 bg-va-yellow/20 rounded-full flex items-center justify-center text-va-yellow mx-auto mb-4">
                            <i class="fas fa-cloud-upload-alt text-3xl"></i>
                        </div>
                        <p class="text-slate-600 font-medium mb-1">Click to upload or drag and drop</p>
                        <p class="text-sm text-slate-400">PDF, JPG, PNG up to 10MB</p>
                        <p id="selectedFile" class="text-sm text-va-blue font-semibold mt-4 hidden bg-va-yellow/10 py-2 px-4 rounded-full inline-block"></p>
                    </div>
                </div>
                <div class="flex gap-4">
                    <button onclick="closeUploadModal()" class="flex-1 px-6 py-3 border-2 border-slate-200 text-slate-600 rounded-2xl hover:bg-slate-50 font-semibold transition-all">Cancel</button>
                    <button onclick="submitCertificate()" class="flex-1 px-6 py-3 btn-primary rounded-2xl">Upload Certificate</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-8 right-8 bg-slate-800/95 backdrop-blur-md text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 z-50 transform transition-all duration-300 translate-y-10 opacity-0">
        <div id="toastIcon" class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center">
            <i class="fas fa-check"></i>
        </div>
        <div>
            <p class="font-semibold" id="toastTitle">Success</p>
            <p class="text-sm text-slate-300" id="toastMessage">Operation completed</p>
        </div>
    </div>

    <script>
        // State
        let currentRole = 'compliance';
        let currentView = 'work';
        let selectedWeekStart = new Date();
        let selectedFile = null;
        
        // Sample Data
        const audits = [
            { id: 1, tenant: 'Woolworths', location: 'Victoria Wharf', time: '10:00 AM', status: 'pending', priority: 'low', type: 'Routine' },
            { id: 2, tenant: 'H&M', location: 'Clock Tower', time: '11:30 AM', status: 'pending', priority: 'medium', type: 'Routine' },
            { id: 3, tenant: 'Ocean Basket', location: 'Portswood', time: '02:00 PM', status: 'urgent', priority: 'high', type: 'Complaint' },
            { id: 4, tenant: 'Tiger\'s Milk', location: 'Water Shed', saved: '2h ago', progress: 60, status: 'draft', type: 'Follow-up' }
        ];

        const scheduleData = {
            'Mon': [{ time: '10:00 AM', task: 'Woolworths Audit', type: 'audit' }],
            'Tue': [{ time: '11:30 AM', task: 'H&M Inspection', type: 'audit' }],
            'Wed': [{ time: '02:00 PM', task: 'Ocean Basket Urgent', type: 'urgent' }],
            'Thu': [],
            'Fri': [{ time: '09:00 AM', task: 'Team Meeting', type: 'meeting' }],
            'Sat': [],
            'Sun': []
        };

        // Store-specific data
        const storeData = {
            name: 'Woolworths',
            location: 'Victoria Wharf, Shop 102-108',
            leaseStart: '2019-03-01',
            leaseEnd: '2026-02-28',
            manager: 'Sarah Johnson',
            contact: 'sarah.j@woolworths.co.za',
            squareMeters: 850,
            monthlyRent: 'R125,000',
            complianceScore: 87,
            lastAudit: '2026-01-15',
            nextAudit: '2026-04-15',
            certificates: [
                { 
                    id: 1, 
                    type: 'health', 
                    name: 'Health & Safety Certificate', 
                    status: 'valid', 
                    issued: '2025-06-01', 
                    expires: '2026-05-31',
                    docUrl: '#',
                    verified: true
                },
                { 
                    id: 2, 
                    type: 'fire', 
                    name: 'Fire Safety Compliance', 
                    status: 'valid', 
                    issued: '2025-08-15', 
                    expires: '2026-08-14',
                    docUrl: '#',
                    verified: true
                },
                { 
                    id: 3, 
                    type: 'insurance', 
                    name: 'Public Liability Insurance', 
                    status: 'warning', 
                    issued: '2025-01-01', 
                    expires: '2026-02-28',
                    docUrl: '#',
                    verified: true
                },
                { 
                    id: 4, 
                    type: 'food', 
                    name: 'Food Safety Certificate', 
                    status: 'expired', 
                    issued: '2024-01-10', 
                    expires: '2025-01-09',
                    docUrl: '#',
                    verified: false
                }
            ],
            auditHistory: [
                { date: '2026-01-15', type: 'Routine', score: 92, findings: 2, status: 'passed' },
                { date: '2025-10-20', type: 'Follow-up', score: 88, findings: 1, status: 'passed' },
                { date: '2025-07-12', type: 'Routine', score: 85, findings: 3, status: 'passed' },
                { date: '2025-04-05', type: 'Complaint', score: 78, findings: 5, status: 'conditional' }
            ],
            upcoming: [
                { date: '2026-04-15', type: 'Quarterly Audit', status: 'scheduled' },
                { date: '2026-03-01', type: 'Fire Safety Check', status: 'pending' }
            ]
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            render();
        });

        function toggleRoleMenu() {
            const menu = document.getElementById('roleMenu');
            menu.classList.toggle('hidden');
        }

        function switchRole(role) {
            currentRole = role;
            currentView = role === 'compliance' ? 'work' : 
                         role === 'operations' ? 'priorities' : 
                         role === 'leadership' ? 'risk' : 'dashboard';
            
            document.getElementById('roleMenu').classList.add('hidden');
            document.getElementById('storeInfo').style.display = role === 'store' ? 'block' : 'none';
            
            const names = {
                'compliance': 'John Doe',
                'operations': 'Mike Smith',
                'leadership': 'Amanda Peters',
                'store': 'Sarah Johnson'
            };
            document.getElementById('userName').textContent = names[role];
            
            render();
        }

        function render() {
            updateHeader();
            renderSidebar();
            renderContent();
        }

        function updateHeader() {
            const badge = document.getElementById('currentRoleBadge');
            const roles = {
                'compliance': { text: 'Compliance Officer', color: 'bg-va-yellow text-va-blue-dark' },
                'operations': { text: 'Operations Manager', color: 'bg-orange-400 text-white' },
                'leadership': { text: 'Mall Leadership', color: 'bg-purple-500 text-white' },
                'store': { text: 'Store Manager', color: 'bg-emerald-500 text-white' }
            };
            badge.textContent = roles[currentRole].text;
            badge.className = `px-4 py-1.5 rounded-full text-sm font-semibold ml-4 shadow-sm ${roles[currentRole].color}`;
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = '';

            const menus = {
                'compliance': [
                    { id: 'work', icon: 'fa-clipboard-list', label: 'My Work' },
                    { id: 'calendar', icon: 'fa-calendar-alt', label: 'Weekly Schedule' },
                    { id: 'tenants', icon: 'fa-building', label: 'Tenants' },
                    { id: 'audits', icon: 'fa-check-square', label: 'Audits' }
                ],
                'operations': [
                    { id: 'priorities', icon: 'fa-exclamation-circle', label: 'Priorities' },
                    { id: 'tenants', icon: 'fa-building', label: 'Tenants' },
                    { id: 'audits', icon: 'fa-clipboard-check', label: 'Audits' },
                    { id: 'maintenance', icon: 'fa-tools', label: 'Maintenance' },
                    { id: 'scheduling', icon: 'fa-calendar', label: 'Staff Scheduling' }
                ],
                'leadership': [
                    { id: 'risk', icon: 'fa-chart-pie', label: 'Risk Overview' },
                    { id: 'precincts', icon: 'fa-map-marker-alt', label: 'All Precincts' },
                    { id: 'analytics', icon: 'fa-chart-line', label: 'Analytics' },
                    { id: 'reports', icon: 'fa-file-alt', label: 'Reports' }
                ],
                'store': [
                    { id: 'dashboard', icon: 'fa-tachometer-alt', label: 'Dashboard' },
                    { id: 'compliance', icon: 'fa-clipboard-check', label: 'Compliance Status' },
                    { id: 'certificates', icon: 'fa-certificate', label: 'Certificates' },
                    { id: 'audits', icon: 'fa-search', label: 'Audit History' },
                    { id: 'messages', icon: 'fa-comments', label: 'Messages' }
                ]
            };

            menus[currentRole].forEach(item => {
                const btn = document.createElement('button');
                btn.className = `nav-item w-full flex items-center gap-4 px-6 py-4 text-slate-600 ${currentView === item.id ? 'active' : ''}`;
                btn.onclick = () => { currentView = item.id; render(); };
                btn.innerHTML = `
                    <div class="w-10 h-10 rounded-xl ${currentView === item.id ? 'bg-white/50' : 'bg-slate-100'} flex items-center justify-center transition-colors">
                        <i class="fas ${item.icon} text-lg"></i>
                    </div>
                    <span class="font-medium">${item.label}</span>
                    ${item.id === 'messages' ? '<span class="ml-auto bg-va-coral text-white text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center">2</span>' : ''}
                `;
                nav.appendChild(btn);
            });
        }

        function renderContent() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '';

            if (currentRole === 'compliance') {
                if (currentView === 'work') renderComplianceWork(main);
                else if (currentView === 'calendar') renderCalendar(main);
                else if (currentView === 'tenants') renderTenants(main);
                else if (currentView === 'audits') renderAudits(main);
            } else if (currentRole === 'operations') {
                if (currentView === 'priorities') renderOpsPriorities(main);
                else if (currentView === 'tenants') renderOpsTenants(main);
                else if (currentView === 'audits') renderOpsAudits(main);
                else if (currentView === 'maintenance') renderMaintenance(main);
                else if (currentView === 'scheduling') renderStaffScheduling(main);
            } else if (currentRole === 'leadership') {

            document.getElementById('uploadModal').classList.remove('hidden');

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.body.style.overflow = '';
            selectedFile = null;
            document.getElementById('selectedFile').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                selectedFile = files[0];
                showSelectedFile();
            }
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                selectedFile = files[0];
                showSelectedFile();
            }
        }

        function showSelectedFile() {
            const el = document.getElementById('selectedFile');
            el.textContent = `Selected: ${selectedFile.name}`;
            el.classList.remove('hidden');
        }

        function submitCertificate() {
            if (!selectedFile) {
                showToast('Please select a file to upload', 'error');
                return;
            }
            
            const type = document.getElementById('certType').value;
            const expiry = document.getElementById('certExpiry').value;
            
            if (!expiry) {
                showToast('Please select an expiry date', 'error');
                return;
            }

            showToast('Certificate uploaded successfully! Pending verification.', 'success');
            closeUploadModal();
            
            const newCert = {
                id: storeData.certificates.length + 1,
                type: type,
                name: document.querySelector(`#certType option[value="${type}"]`).textContent,
                status: 'valid',
                issued: new Date().toISOString().split('T')[0],
                expires: expiry,
                docUrl: '#',
                verified: false
            };
            storeData.certificates.unshift(newCert);
            
            if (currentView === 'certificates') {
                setTimeout(() => render(), 500);
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const titleEl = document.getElementById('toastTitle');
            const msgEl = document.getElementById('toastMessage');
            const icon = document.getElementById('toastIcon');
            
            titleEl.textContent = type === 'success' ? 'Success!' : 'Error';
            msgEl.textContent = message;
            
            if (type === 'success') {
                icon.className = 'w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-white';
                icon.innerHTML = '<i class="fas fa-check"></i>';
            } else {
                icon.className = 'w-10 h-10 rounded-full bg-red-500 flex items-center justify-center text-white';
                icon.innerHTML = '<i class="fas fa-exclamation"></i>';
            }
            
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

            return `${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
        }

        function getDateForDay(index) {
            const date = new Date(selectedWeekStart);
            date.setDate(date.getDate() + index);
            return date.getDate();
        }

        function changeWeek(direction) {
            selectedWeekStart.setDate(selectedWeekStart.getDate() + (direction * 7));
            render();

                scheduleData[day].push({ time: '09:00 AM', task: task, type: 'audit' });

        function editSchedule(day, task) {
            if (confirm(`Remove "${task}" from ${day}?`)) {

                            <p class="text-4xl font-bold text-slate-800">72<span class="text-2xl text-slate-400">/100</span></p>

                        <div class="card p-6">

                        <div class="card p-6">

                        <div class="card p-6">

                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="card p-8">

                                    <div class="flex justify-between mb-2">

        function renderPrecincts(container) {
            container.innerHTML = `

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${[
                            { name: 'Victoria Wharf', status: 'Operational', occupancy: '92%', alerts: 2 },
                            { name: 'Clock Tower', status: 'Operational', occupancy: '88%', alerts: 0 },
                            { name: 'Portswood', status: 'Maintenance', occupancy: '75%', alerts: 1 },
                            { name: 'Water Shed', status: 'Operational', occupancy: '95%', alerts: 0 },
                            { name: 'Silo District', status: 'Operational', occupancy: '82%', alerts: 1 }
                        ].map(precinct => `
                            <div class="card p-6 hover:shadow-xl transition-all cursor-pointer group">
                                <div class="flex justify-between items-start mb-6">
                                    <div class="w-16 h-16 bg-gradient-to-br from-va-blue to-va-blue-light rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-lg group-hover:scale-110 transition-transform">

                                    </span>
                                </div>
                                <h3 class="font-bold text-xl text-slate-800 mb-4">${precinct.name}</h3>
                                <div class="space-y-3 mb-6">
                                    <div class="flex justify-between text-sm">
                                        <span class="text-slate-500 font-medium">Occupancy</span>
                                        <span class="font-bold text-slate-800">${precinct.occupancy}</span>
                                    </div>
                                    <div class="flex justify-between text-sm">
                                        <span class="text-slate-500 font-medium">Active Alerts</span>
                                        <span class="font-bold ${precinct.alerts > 0 ? 'text-red-600' : 'text-emerald-600'}">${precinct.alerts}</span>
                                    </div>
                                    <div class="flex justify-between text-sm">
                                        <span class="text-slate-500 font-medium">Tenants</span>
                                        <span class="font-bold text-slate-800">${Math.floor(Math.random() * 50 + 20)}</span>

                                    View Details
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAnalytics(container) {
            container.innerHTML = `
                <div class="fade-in">
                    <h2 class="text-3xl font-bold text-va-blue-dark mb-2">Performance Analytics</h2>
                    <p class="text-slate-600 text-lg mb-8">Historical trends and performance metrics</p>
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div class="card p-8">
                            <h3 class="font-bold text-xl text-slate-800 mb-6">Compliance Trends (6 Months)</h3>
                            <div class="h-64 flex items-end justify-between gap-4">
                                ${[85, 87, 90, 88, 92, 94].map((val, i) => `
                                    <div class="flex-1 flex flex-col items-center gap-3 group">
                                        <div class="w-full bg-gradient-to-t from-va-blue to-va-blue-light rounded-t-2xl shadow-lg relative overflow-hidden group-hover:from-va-yellow group-hover:to-va-yellow transition-all duration-300" style="height: ${val * 2}px">
                                            <div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity"></div>
                                        </div>
                                        <span class="text-sm font-bold text-slate-500 group-hover:text-va-blue transition-colors">${['Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb'][i]}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="card p-8">
                            <h3 class="font-bold text-xl text-slate-800 mb-6">Incident Resolution Time</h3>
                            <div class="space-y-4">
                                <div class="flex items-center justify-between p-5 bg-red-50/80 rounded-2xl border-2 border-red-100">
                                    <span class="font-medium text-slate-700">Critical Issues</span>
                                    <span class="font-bold text-red-600 text-xl">2.4 hours</span>
                                </div>
                                <div class="flex items-center justify-between p-5 bg-orange-50/80 rounded-2xl border-2 border-orange-100">

                                </div>
                                <div class="flex items-center justify-between p-5 bg-emerald-50/80 rounded-2xl border-2 border-emerald-100">
                                    <span class="font-medium text-slate-700">Low Priority</span>
                                    <span class="font-bold text-emerald-600 text-xl">3.2 days</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReports(container) {
            container.innerHTML = `
                <div class="fade-in">

                    <p class="text-slate-600 text-lg mb-8">Downloadable reports and documentation</p>
                    
                    <div class="card overflow-hidden">
                        <div class="p-8 border-b border-slate-100 bg-gradient-to-r from-slate-50/80 to-white">

                                <button class="px-6 py-3 btn-primary rounded-2xl shadow-lg flex items-center gap-2">

                            </div>
                        </div>
                        <div class="divide-y divide-slate-100">

                                            <p class="text-sm text-slate-500">${report.date} • ${report.type} • ${report.size}</p>
                                        </div>
                                    </div>
                                    <div class="flex gap-3">
                                        <button class="px-4 py-2 border-2 border-slate-200 rounded-xl font-semibold text-slate-600 hover:border-va-yellow hover:bg-va-yellow/5 transition-all">Preview</button>
                                        <button class="px-4 py-2 bg-va-blue text-white rounded-xl font-bold hover:bg-va-blue-dark transition-all shadow-lg">Download</button>

        function startAudit(id) {
            showToast(`Starting audit #${id}...`, 'success');
        }

        // Close role menu when clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('roleMenu');
            const btn = e.target.closest('div');
            if (!btn || !btn.querySelector('.fa-chevron-down')) {
                if (!menu.classList.contains('hidden')) {
                    menu.classList.add('hidden');
                }
            }
        });
    </script>
